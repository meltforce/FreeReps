name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  # A manual run is always a rehearsal: it builds the image and both binaries,
  # and signs in to Docker Hub so the credentials are exercised, but it pushes
  # nothing and creates no release. There is no input to turn that off, so a
  # manual run cannot publish by mistake — publishing happens on a tag.
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: meltforce
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: server
          # arm64 is here so a self-hosted install on a Pi or an Apple Silicon
          # machine can pull the release; through 1.2.0 the manifest carried
          # amd64 alone and `docker pull` on arm64 failed with "no matching
          # manifest". The Dockerfile cross-compiles rather than emulating, so
          # the second platform costs a Go build, not a QEMU run.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            meltforce/freereps:latest
            meltforce/freereps:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          # Without this the action looks for the checksums at the repository
          # root, reports "Dependencies file is not found" and skips the module
          # cache, so every run downloads the dependencies again.
          cache-dependency-path: server/go.sum

      - name: Build freereps-upload
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        working-directory: server
        run: |
          go build \
            -ldflags "-X main.Version=${GITHUB_REF_NAME}" \
            -o freereps-upload-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/freereps-upload

      - uses: actions/upload-artifact@v7
        with:
          name: freereps-upload-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server/freereps-upload-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: [docker, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/freereps-upload-*
          body: |
            ## Server Setup

            **Fresh install:**

            ```bash
            git clone https://github.com/meltforce/FreeReps.git
            cd FreeReps
            cp server/config.example.yaml server/config.yaml
            # Edit config.yaml — set database password, enable Tailscale
            cd server && docker compose up -d
            ```

            **Upgrade existing server:**

            ```bash
            cd server
            docker compose pull
            docker compose up -d
            ```

            ## Upload Tool (macOS)

            **One-liner install:**

            ```bash
            curl -sSL https://raw.githubusercontent.com/meltforce/FreeReps/main/server/scripts/install-upload.sh | bash
            ```

            **Or download manually** from the assets below and place in `/usr/local/bin/`.

            Requires `lzfse`: `brew install lzfse`
