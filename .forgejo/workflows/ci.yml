name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: docker
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          # The module checksums sit under server/, and the action looks for
          # them at the repository root. Without this the module cache is never
          # restored and every run downloads the dependencies again.
          cache-dependency-path: server/go.sum
      # The web UI is embedded via go:embed web/dist — without the directory
      # the backend does not compile. The real assets come from the `frontend`
      # job / the Dockerfile's frontend stage; here a stub is enough.
      - name: Stub web/dist for embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: server

  frontend:
    runs-on: docker
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  documents:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      # check-docs.sh reads the module selection from
      # .claude/project-standards.json with python3. Without python3, has_module
      # returns false, the language sweep prints "skipped" and this job goes
      # green having checked nothing — install it rather than let that happen.
      - name: Ensure python3
        run: command -v python3 || (apt-get update -qq && apt-get install -y -qq python3)
      - run: tools/check-docs.sh --all

  build-deploy:
    # `documents` is deliberately not in `needs`: a roadmap row in the wrong
    # place makes the workflow red, but must not hold back a server deploy.
    needs: [backend, frontend]
    # Deliberately no `github.event_name` check: in a `uses:` job the condition
    # is evaluated in the *called* workflow, where the event is `workflow_call`
    # — a comparison against `push` silently skips build and deploy while the
    # caller still reports success (cast2md lost its :edge builds that way for
    # a month). `github.ref` stays correct and is refs/pull/N/merge on PRs.
    if: github.ref == 'refs/heads/main'
    uses: meltforce.net/ci-workflows/.forgejo/workflows/build-push-deploy.yml@v6
    with:
      app_name: freereps
      target_host: freereps-lxc.coydog-fence.ts.net
      # The shared workflow's health step is gated on this input being set
      # (`if: inputs.health_url != ''`). Without it the deploy job reports
      # success as soon as `docker compose up -d` returns, which says nothing
      # about whether the service serves. vimmary lost an outage to exactly
      # that on 2026-08-06. freereps had no health check on either path — the
      # Ansible catalog entry gained one in the same change.
      health_url: https://freereps.coydog-fence.ts.net/healthz
      # Dockerfile and build context live in server/, not at the repo root.
      build_context: server
      # The deployed compose belongs to homelab (Ansible writes compose.yaml
      # into /opt/docker/stacks/freereps together with .env and config.yaml).
      sync_compose: false
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  notify-deploy-failure:
    needs: [build-deploy]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: host
    steps:
      - name: ntfy alert
        run: |
          curl -fsS --max-time 10 \
            -H "Title: freereps CI deploy FAILED (${GITHUB_SHA:0:7})" \
            -H "Priority: high" \
            -H "Tags: warning,docker,freereps" \
            -d "Build/deploy failed for commit ${GITHUB_SHA}. :edge may be in a broken state — pin the previous digest in the homelab catalog or push a fix. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.coydog-fence.ts.net/claude || true
